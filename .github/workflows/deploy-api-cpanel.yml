name: Deploy API to cPanel

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-api-cpanel.yml"
      - "apps/api/**"
      - "packages/types/**"
      - "packages/utils/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
  workflow_dispatch:

concurrency:
  group: cpanel-api-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API
        run: pnpm --filter api build

      - name: Prepare API deployment bundle
        run: |
          rm -rf .cpanel-deploy/api
          mkdir -p .cpanel-deploy/api/tmp
          cp apps/api/app.js .cpanel-deploy/api/
          cp apps/api/package.json .cpanel-deploy/api/
          cp -r apps/api/dist .cpanel-deploy/api/dist
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .cpanel-deploy/api/tmp/restart.txt

      - name: Deploy API to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CPANEL_FTP_SERVER }}
          username: ${{ secrets.CPANEL_FTP_USERNAME }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          protocol: ftps
          port: ${{ secrets.CPANEL_FTP_PORT || 21 }}
          security: loose
          timeout: 120000
          log-level: verbose
          local-dir: ./.cpanel-deploy/api/
          server-dir: ${{ secrets.API_CPANEL_REMOTE_DIR }}
          dangerous-clean-slate: false
