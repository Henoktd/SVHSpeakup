name: Deploy Investigator Portal to cPanel

on:
  workflow_dispatch:

concurrency:
  group: cpanel-investigator-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build investigator portal
        env:
          VITE_API_BASE_URL: ${{ secrets.INVESTIGATOR_VITE_API_BASE_URL }}
          VITE_INVESTIGATOR_ENTRA_TENANT_ID: ${{ secrets.INVESTIGATOR_VITE_INVESTIGATOR_ENTRA_TENANT_ID }}
          VITE_INVESTIGATOR_ENTRA_CLIENT_ID: ${{ secrets.INVESTIGATOR_VITE_INVESTIGATOR_ENTRA_CLIENT_ID }}
          VITE_INVESTIGATOR_API_SCOPE: ${{ secrets.INVESTIGATOR_VITE_INVESTIGATOR_API_SCOPE }}
        run: pnpm --filter investigator-portal build

      - name: Deploy investigator portal to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CPANEL_FTP_SERVER }}
          username: ${{ secrets.CPANEL_FTP_USERNAME }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          protocol: ftps
          port: ${{ secrets.CPANEL_FTP_PORT || 21 }}
          security: loose
          timeout: 120000
          log-level: verbose
          local-dir: ./apps/investigator-portal/dist/
          server-dir: ${{ secrets.INVESTIGATOR_CPANEL_REMOTE_DIR }}
          dangerous-clean-slate: false
